
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel de estadísticas</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #123b59;
    }
    .panel {
      background: white;
      padding: 32px;
      margin: 20px;
      border-radius: 16px;
      text-align: center;
      max-width: 420px;
      box-shadow: 0 8px 24px #0001;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Panel de estadísticas</h1>
    <p>Bienvenido a tu centro de resultados.</p>
    <p>Próximamente podrás acceder a las métricas de tus campañas.</p>
  </div>
</body>
</html>
